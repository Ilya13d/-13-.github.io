<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Блог Заядлого Путешественника</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">Обо мне</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Напишите мне</h1>
        <div class="contact-form">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Ваше имя *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Тема</label>
                    <select id="subject" name="subject">
                        <option value="question">Вопрос о путешествиях</option>
                        <option value="cooperation">Сотрудничество</option>
                        <option value="feedback">Отзыв о блоге</option>
                        <option value="other">Другое</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Отправить сообщение</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Контакты: elijah@gmail.com | Телефон: +7 (XXX) XXX-XX-XX</p>
        <p>&copy; 2026 Блог Заядлого Путешественника</p>
    </footer>
</body>
</html>
